name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit, mock-Odoo and workflow simulation tests
        run: node --test tests/*.test.js
      - name: n8n workflow is in sync with src/
        run: node scripts/build-workflow.js --check

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml with placeholder values
        run: |
          cp .env.example .env
          docker compose config --quiet
          bash -n docker/postgres-init.sh
