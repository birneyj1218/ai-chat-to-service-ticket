# Local demo stack: Chatwoot (chat), n8n (workflow), Odoo (tickets), Postgres, Redis.
# All values come from .env (copy .env.example and fill it in). Ports bind to 127.0.0.1 only;
# put a TLS reverse proxy in front before exposing anything to the internet.
name: ai-chat-to-service-ticket

x-chatwoot-env: &chatwoot-env
  NODE_ENV: production
  RAILS_ENV: production
  INSTALLATION_ENV: docker
  SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:?set CHATWOOT_SECRET_KEY_BASE in .env}
  FRONTEND_URL: ${CHATWOOT_FRONTEND_URL:-http://localhost:3000}
  ENABLE_ACCOUNT_SIGNUP: "false"
  ACTIVE_STORAGE_SERVICE: local
  POSTGRES_HOST: postgres
  POSTGRES_USERNAME: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DATABASE: chatwoot
  REDIS_URL: redis://redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

services:
  postgres:
    image: pgvector/pgvector:pg16 # Chatwoot needs the pgvector extension
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:?set ODOO_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data

  chatwoot-migrate:
    image: chatwoot/chatwoot:${CHATWOOT_VERSION:-v4.18.0}
    environment: *chatwoot-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    restart: "no"

  chatwoot:
    image: chatwoot/chatwoot:${CHATWOOT_VERSION:-v4.18.0}
    restart: unless-stopped
    environment: *chatwoot-env
    depends_on:
      chatwoot-migrate: { condition: service_completed_successfully }
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - chatwoot-storage:/app/storage

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:${CHATWOOT_VERSION:-v4.18.0}
    restart: unless-stopped
    environment: *chatwoot-env
    depends_on:
      chatwoot-migrate: { condition: service_completed_successfully }
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - chatwoot-storage:/app/storage

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.42.6}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168" # hours: keep chat executions for 7 days at most
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n

  odoo:
    image: odoo:${ODOO_VERSION:-19.0}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      HOST: postgres
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD:?set ODOO_DB_PASSWORD in .env}
    # First start: create the "servicedesk" database with the Project app installed.
    command: ["--", "--database=servicedesk", "--init=project", "--db-filter=^servicedesk$$"]
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo

volumes:
  postgres-data:
  redis-data:
  chatwoot-storage:
  n8n-data:
  odoo-data:
